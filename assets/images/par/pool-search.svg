<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1240" role="img" aria-labelledby="title desc">
<title id="title">SGD-inspired rubric pool text optimization</title><desc id="desc">A strong external model uses training errors and expert explanations to edit the rubric pool with an adaptive budget. Regenerate rubrics and verify, evaluate training, validation and OOD results, and retain improvements without updating model parameters.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d969b"/></marker></defs>
<rect width="1100" height="1240" rx="20" fill="white"/>
<text x="30" y="35" fill="#147d73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">
<tspan x="30" dy="0">CONTEXT OPTIMIZATION / FIXED GENERATOR AND VERIFIER</tspan>
</text>
<rect x="210" y="70" width="680" height="88" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="101" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">Initialize</tspan>
</text>
<text x="550.0" y="129" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Handbook, train + explanations, validation / OOD, models</tspan>
</text>
<rect x="210" y="185" width="680" height="88" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="216" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">Measure the baseline</tspan>
</text>
<text x="550.0" y="244" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Run generation and verification; inspect training errors</tspan>
</text>
<polyline points="550,158 550,181" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="210" y="300" width="680" height="88" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="331" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">Select anchor + edit budget</tspan>
</text>
<text x="550.0" y="359" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Start with 5 edits; expand after 5 rounds without improvement</tspan>
</text>
<polyline points="550,273 550,296" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="210" y="415" width="680" height="88" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="446" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">Analyze failure patterns</tspan>
</text>
<text x="550.0" y="474" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Strong model compares train verdicts, labels and explanations</tspan>
</text>
<polyline points="550,388 550,411" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="210" y="530" width="680" height="88" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="561" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">Edit rubric pool entries</tspan>
</text>
<text x="550.0" y="589" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Add / Remove / Split / Merge; keep the protocol and output format</tspan>
</text>
<polyline points="550,503 550,526" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="210" y="645" width="680" height="88" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="550.0" y="676" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">Validate the patch</tspan>
</text>
<text x="550.0" y="704" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Check scope, format and edit count against budget L</tspan>
</text>
<polyline points="550,618 550,641" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="210" y="760" width="680" height="88" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="791" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">Regenerate rubrics</tspan>
</text>
<text x="550.0" y="819" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Track generation success and evaluate with the verifier</tspan>
</text>
<polyline points="550,733 550,756" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="210,689 118,689 118,574 205,574" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="105" y="620" fill="#c76243" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="105" dy="0">Invalid</tspan>
</text>
<rect x="30" y="885" width="290" height="85" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="175.0" y="916" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
<tspan x="175.0" dy="0">Training evaluation</tspan>
</text>
<text x="175.0" y="944" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="175.0" dy="0">Labels + explanations</tspan>
</text>
<polyline points="550,848 550,866 175,866 175,881" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="175,970 175,990 550,990 550,1004" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="405" y="885" width="290" height="85" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="550.0" y="916" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">Validation evaluation</tspan>
</text>
<text x="550.0" y="944" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Measure generalization</tspan>
</text>
<polyline points="550,848 550,866 550,866 550,881" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="550,970 550,990 550,990 550,1004" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="780" y="885" width="290" height="85" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="925.0" y="916" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
<tspan x="925.0" dy="0">OOD evaluation</tspan>
</text>
<text x="925.0" y="944" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="925.0" dy="0">Measure transfer</tspan>
</text>
<polyline points="550,848 550,866 925,866 925,881" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="925,970 925,990 550,990 550,1004" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="210" y="1008" width="680" height="85" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="550.0" y="1039" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">Compare metrics + generation success gate</tspan>
</text>
<text x="550.0" y="1067" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Goal: improve mean validation / OOD accuracy</tspan>
</text>
<rect x="30" y="1130" width="460" height="78" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="260.0" y="1161" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
<tspan x="260.0" dy="0">No improvement: retain best</tspan>
</text>
<text x="260.0" y="1189" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="260.0" dy="0">After 5 stagnant rounds: 5 → 10 → 15 edits</tspan>
</text>
<rect x="610" y="1130" width="460" height="78" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="840.0" y="1161" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
<tspan x="840.0" dy="0">Improvement: save new best</tspan>
</text>
<text x="840.0" y="1189" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="840.0" dy="0">Return to anchor selection while budget remains</tspan>
</text>
<polyline points="550,1093 550,1110 260,1110 260,1126" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="550,1093 550,1110 840,1110 840,1126" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="1070,1170 1087,1170 1087,344 895,344" fill="none" stroke="#7d969b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<polyline points="30,1170 13,1170 13,344 205,344" fill="none" stroke="#7d969b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
</svg>
