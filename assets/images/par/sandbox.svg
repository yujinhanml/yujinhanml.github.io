<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Specialist discovery in a local sandbox</title><desc id="desc">Specialist discovery in a local sandbox</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d969b"/></marker></defs>
<rect width="1100" height="460" rx="20" fill="white"/>
<text x="30" y="35" fill="#147d73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">
<tspan x="30" dy="0">FROM A FAILURE CASE TO A VALIDATED TOOL</tspan>
</text>
<rect x="25" y="70" width="230" height="145" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="140.0" y="101" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
<tspan x="140.0" dy="0">Locate the gap</tspan>
</text>
<text x="140.0" y="129" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="140.0" dy="0">Rubric + human explanation</tspan>
</text>
<polyline points="260,142 295,142" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="305" y="70" width="230" height="145" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="420.0" y="101" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
<tspan x="420.0" dy="0">Run candidates</tspan>
</text>
<text x="420.0" y="129" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="420.0" dy="0">Local sandbox experiments</tspan>
</text>
<polyline points="540,142 575,142" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="585" y="70" width="230" height="145" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="700.0" y="101" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
<tspan x="700.0" dy="0">Test both sides</tspan>
</text>
<text x="700.0" y="129" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="700.0" dy="0">Detection + false</tspan>
<tspan x="700.0" dy="23.2">rejection</tspan>
</text>
<polyline points="820,142 855,142" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="865" y="70" width="230" height="145" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="980.0" y="101" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
<tspan x="980.0" dy="0">Integrate</tspan>
</text>
<text x="980.0" y="129" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="980.0" dy="0">Task-conditioned routing</tspan>
</text>
<rect x="30" y="275" width="1040" height="105" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="306" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">Example: Audio Consistency Checker</tspan>
</text>
<text x="550.0" y="334" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Waveform correlation · spectral similarity · coherence · residual signal analysis</tspan>
</text>
<text x="550" y="425" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">
<tspan x="550" dy="0">The same workflow can add lip-sync and visual-quality specialists.</tspan>
</text>
</svg>
