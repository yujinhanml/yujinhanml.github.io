<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Step 3 expanded: operator discovery and validation</title><desc id="desc">Build a local validation set, execute candidate operators with a strong model, assess detection and false rejection, and select tools for fixed routing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d969b"/></marker></defs>
<rect width="1100" height="760" rx="20" fill="white"/>
<text x="30" y="35" fill="#147d73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">
<tspan x="30" dy="0">STEP 3 EXPANDED / LOCAL SANDBOX EXPERIMENTS</tspan>
</text>
<rect x="165" y="70" width="770" height="105" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="101" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">1. Build a focused validation set</tspan>
</text>
<text x="550.0" y="129" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">50 abnormal cases + 50 normal cases</tspan>
</text>
<polyline points="550,175 550,215" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="165" y="220" width="770" height="105" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="251" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">2. Execute candidate operators</tspan>
</text>
<text x="550.0" y="279" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Strong model proposes and runs candidates in a local sandbox</tspan>
</text>
<polyline points="550,325 550,365" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="165" y="370" width="770" height="105" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="550.0" y="401" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">3. Validate on both sides</tspan>
</text>
<text x="550.0" y="429" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">High failure-detection rate + low false-rejection rate</tspan>
</text>
<polyline points="550,475 550,515" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="165" y="520" width="770" height="105" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="551" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">4. Select operators for deployment</tspan>
</text>
<text x="550.0" y="579" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Bind validated specialists to applicable rubrics and fixed routes</tspan>
</text>
<polyline points="935,422 1005,422 1005,272 941,272" fill="none" stroke="#7d969b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="1017" y="342" fill="#c76243" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">
<tspan x="1017" dy="0">Retry</tspan>
</text>
<text x="550" y="690" fill="#147d73" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="middle">
<tspan x="550" dy="0">Example: Audio Consistency Checker for visual_only tasks</tspan>
</text>
<text x="550" y="728" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
<tspan x="550" dy="0">Apply preservation checks only where the instruction requires preservation.</tspan>
</text>
</svg>
