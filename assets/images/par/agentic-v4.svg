<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 655" role="img" aria-labelledby="title desc">
<title id="title">Agentic PAR V4 evidence-based harness</title><desc id="desc">Agentic PAR V4 evidence-based harness</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d969b"/></marker></defs>
<rect width="1100" height="655" rx="20" fill="white"/>
<text x="30" y="35" fill="#147d73" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">
<tspan x="30" dy="0">V4 · EXPLORATORY · EVIDENCE-BASED ORCHESTRATION</tspan>
</text>
<rect x="190" y="65" width="720" height="110" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="96" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">1. Rubric gap review</tspan>
</text>
<text x="550.0" y="124" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Review the task and add missing, task-relevant checks</tspan>
</text>
<polyline points="550,175 550,225" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="190" y="230" width="720" height="110" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="550.0" y="261" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">2. Tool orchestration</tspan>
</text>
<text x="550.0" y="289" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Bind tools to rubrics; collect an evidence bundle for each check</tspan>
</text>
<polyline points="550,340 550,390" fill="none" stroke="#7d969b" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="190" y="395" width="720" height="110" rx="12" fill="#eaf5f1" stroke="#dce5e4"/>
<text x="550.0" y="426" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle">
<tspan x="550.0" dy="0">3. Evidence-based judgment</tspan>
</text>
<text x="550.0" y="454" fill="#60747a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="550.0" dy="0">Judge each rubric; send conflicting evidence to an independent adjudicator</tspan>
</text>
<rect x="30" y="552" width="1040" height="65" rx="12" fill="#f8f5ee" stroke="#dce5e4"/>
<text x="550" y="591" fill="#193b45" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">
<tspan x="550" dy="0">Tool capability supplies evidence. The harness determines how to use it.</tspan>
</text>
</svg>
